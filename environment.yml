name: cinegacha
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip>=24.0

  # Web Framework
  - flask>=3.0.0
  - flask-sqlalchemy>=3.1.0
  - sqlalchemy>=2.0.0

  # HTTP Client
  - httpx>=0.27.0

  # Encryption
  - cryptography>=44.0.0

  # Task Queue
  - apscheduler>=3.10.0

  # Testing
  - pytest>=8.0.0
  - pytest-mock>=3.14.0
  - pytest-cov>=5.0.0

  # Development
  - ipython>=8.0.0

  # pip packages (not in conda channels)
  - pip:
    - flask-debugtoolbar>=0.15.0
